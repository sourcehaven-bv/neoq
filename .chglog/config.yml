style: github
template: CHANGELOG.tpl.md
info:
  title: CHANGELOG
  repository_url: https://github.com/acaloiaro/neoq
options:
  commits:
    filters:
      Type:
        - feat
        - fix
        - refactor
        - chore
  commit_groups:
    title_maps:
      feat: Features
      fix: Bug Fixes
      refactor: Code Refactoring
      chore: Maintenance
  header:
    pattern: '^(\w*)(?:\((.*)\))?:\s(.*)$'
    pattern_maps:
      - Type
      - Scope
      - Subject
  issues:
    prefix:
      - #
