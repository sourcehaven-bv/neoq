name: prerelease

on:
  workflow_dispatch: {}

jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        run: |
          git clone "${{ github.server_url }}/${{ github.repository }}.git" .
          git checkout "${{ github.sha }}"

      - uses: https://github.com/cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Compute prerelease version
        id: ver
        shell: bash -c "rm -rf /homeless-shelter; nix develop --impure -c bash -- {0}"
        run: |
          LABEL=$(printf '%s' "${{ github.ref_name }}" | tr -c 'a-zA-Z0-9' '-')
          VERSION=$(svu next --always --prerelease="${LABEL}.${{ github.run_number }}")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        shell: bash -c "rm -rf /homeless-shelter; nix develop --impure -c bash -- {0}"
        run: git-chglog --next-tag="${{ steps.ver.outputs.version }}" "${{ steps.ver.outputs.version }}" > release-notes.md

      - name: Push tag
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          HOST="https://code.adriano.fyi"
          git remote set-url origin "https://oauth2:${TOKEN}@${HOST#*://}/${{ github.repository }}.git"
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Create prerelease
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          curl --fail-with-body -X POST \
            -H "Authorization: token ${TOKEN}" \
            -H "Content-Type: application/json" \
            "https://code.adriano.fyi/api/v1/repos/${{ github.repository }}/releases" \
            -d "{\"tag_name\":\"${VERSION}\",\"name\":\"${VERSION}\",\"body\":$(jq -Rs . release-notes.md),\"prerelease\":true}"
